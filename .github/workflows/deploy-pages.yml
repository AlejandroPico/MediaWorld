name: Publicar MediaWorld en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar recuperación del catálogo
        run: node --test scripts/restore-published-catalog.test.mjs
      - name: Actualizar radios y televisiones regionales
        id: refresh
        continue-on-error: true
        run: npm run catalog:refresh
      - name: Compilar aplicación y catálogo
        if: steps.refresh.outcome == 'success'
        run: npm run build
      - name: Recuperar catálogo publicado y compilar aplicación
        if: steps.refresh.outcome == 'failure'
        run: |
          node scripts/restore-published-catalog.mjs
          npm run typecheck
          npx vite build
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
